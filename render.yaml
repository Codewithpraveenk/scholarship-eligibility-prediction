services:
  - type: web
    name: scholarpath
    runtime: docker
    plan: starter
    healthCheckPath: /health
    disk:
      name: scholarship-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_PATH
        value: /data/scholarpath.db
      - key: APP_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
